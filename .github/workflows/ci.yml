name: CI

# Real CI, added 2026-09-21 to close a gap an external audit caught: this
# repo's commit messages had been claiming "N tests pass" with no GitHub
# commit-status check to verify it -- local test runs are real evidence,
# but they are not CI-verified evidence. This makes that claim checkable.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install and start Ollama, pull the real embedding model
        # test_execution_gateway.py's real-semantic-cache tests call the
        # real embedding path (no mock) -- same discipline as the Redis/
        # Qdrant service containers above: real infra in CI, not skipped
        # coverage. nomic-embed-text is small (~274MB); CPU inference on a
        # GitHub-hosted runner is slow but adequate for the handful of
        # short test embeddings this suite makes.
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags && break || sleep 2; done
          ollama pull nomic-embed-text

      - name: Wait for Qdrant to be healthy
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:6333/healthz && break || sleep 1; done

      - name: Validate all YAML config parses
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          failures = []
          for path in sorted(Path("config").glob("*.yaml")):
              try:
                  yaml.safe_load(path.read_text())
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              print("YAML validation failed:")
              for f in failures:
                  print(f" - {f}")
              sys.exit(1)
          print(f"OK: {len(list(Path('config').glob('*.yaml')))} config files parse cleanly")
          PY

      - name: Check config integrity (no silent drift from the committed baseline)
        run: python3 scripts/config_integrity.py check

      - name: Run test suite
        run: python3 -m pytest tests/ -v

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install semgrep
        run: pip install semgrep
      - name: Run semgrep (Python security + correctness rules)
        run: semgrep --config p/python --config p/security-audit --error --quiet scripts/ portal/

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (to record real, resolved versions)
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install syft
        # Same retry as the grype install step below -- both use anchore's
        # identical install-script pattern (GitHub release-tag lookup), so
        # both are exposed to the same class of transient GitHub API 504.
        run: |
          for attempt in 1 2 3; do
            if curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin; then
              exit 0
            fi
            echo "syft install attempt $attempt failed, retrying in 10s..." >&2
            sleep 10
          done
          echo "syft install failed after 3 attempts" >&2
          exit 1

      - name: Pin real installed versions
        # syft's python cataloger deliberately skips unpinned ranges (our
        # requirements.txt uses PyYAML>=6.0,<7.0 style ranges on purpose,
        # so a patch release doesn't need a manual bump) -- generate the
        # exact resolved versions actually installed this run instead of
        # guessing, so the SBOM reflects what's really running.
        run: pip freeze | grep -iE "^(pyyaml|redis|qdrant-client)==" > requirements-lock.txt

      - name: Generate SBOM (CycloneDX)
        run: syft dir:. -o cyclonedx-json=sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      - name: Install grype
        # Real, observed flakiness (not hypothetical): grype's install
        # script hit a genuine GitHub API 504 on the release-tag lookup
        # twice in this repo's own CI history (runs 35615126886 and an
        # earlier one) -- an external transient failure unrelated to this
        # repo's code. Retrying the whole install (not just the curl) since
        # the failure is inside the downloaded script's own tag-resolution
        # logic, not the download itself.
        run: |
          for attempt in 1 2 3; do
            if curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin; then
              exit 0
            fi
            echo "grype install attempt $attempt failed, retrying in 10s..." >&2
            sleep 10
          done
          echo "grype install failed after 3 attempts" >&2
          exit 1

      - name: Scan SBOM for known vulnerabilities (SCA)
        # Real SCA, not just an inventory: fails the build on high/critical
        # CVEs in the exact resolved dependency versions the SBOM step just
        # recorded. Verified locally before adding this gate: an
        # intentionally old PyYAML==5.1 correctly surfaces 3 real critical
        # CVEs; the actual pinned versions in this repo scan clean.
        run: grype sbom:sbom.cdx.json --fail-on high
