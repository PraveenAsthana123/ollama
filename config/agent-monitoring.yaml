version: 1
event_store:
  path: ~/.local/state/ollama-control-tower/monitor/events.jsonl
  store_prompt_bodies: false
  store_tool_arguments: false
  retention_days: 30

dimensions:
  - health
  - task
  - supervisor
  - a2a
  - mcp
  - model
  - tokens
  - cost
  - performance
  - memory
  - quality
  - security

alerts:
  error_rate_warn: 0.10
  error_rate_pause: 0.25
  p95_latency_warn_ms: 10000
  repeated_failures_pause: 3
  policy_violation_kill: true
  budget_exhausted_pause: true
  stale_heartbeat_seconds: 300

exporters:
  opentelemetry:
    enabled: false
    protocol: otlp_http
    endpoint: http://127.0.0.1:4318
  agentops:
    enabled: false
    environment_key: AGENTOPS_API_KEY
  langfuse:
    enabled: false
    endpoint: http://127.0.0.1:3000
    public_key_environment: LANGFUSE_PUBLIC_KEY
    secret_key_environment: LANGFUSE_SECRET_KEY
  phoenix:
    enabled: false
    endpoint: http://127.0.0.1:6006/v1/traces

privacy:
  redact_keys: [authorization, cookie, password, secret, token, api_key]
  allow_raw_prompts: false
  allow_raw_tool_arguments: false
